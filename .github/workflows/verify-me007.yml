name: TOE-001 conditional ME-007 consistency tests
on:
  push:
    paths:
      - 'toe001/**'
      - 'tests/**'
      - 'results/me007*'
      - 'results/f03*'
      - 'scripts/check_me007_symbolic.py'
      - 'scripts/run_me007_identity.py'
      - 'scripts/run_me007_covariant.py'
      - 'scripts/run_f03_oscillators.py'
      - 'scripts/f03_calibration_template.json'
      - 'scripts/check_me007_covariant_symbolic.py'
      - 'F02_COVARIANT_INFORMATION_ACTION.md'
      - 'F03_TWO_OSCILLATOR_MEASUREMENT_PROTOCOL.md'
      - 'F01_ME007_INFORMATION_IDENTIFICATION.md'
      - 'ME007_INTEGRATION.md'
      - 'index.html'
      - '.github/workflows/verify-me007.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classical-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Select Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run old and new model tests
        run: python3 -m unittest discover -s tests -v
      - name: Regenerate and compare frozen F01 information record
        run: |
          cp results/me007_identity_reference.json /tmp/me007_identity_frozen.json
          python3 scripts/run_me007_identity.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          original=json.loads(Path('/tmp/me007_identity_frozen.json').read_text())
          regenerated=json.loads(Path('results/me007_identity_reference.json').read_text())
          assert original == regenerated, 'F01 reference does not reproduce from frozen seed'
          assert original['is_efmw_specific'] is False
          assert original['me006_recursive_tensor_physically_identified'] is False
          assert original['experiment_on_real_physical_data'] is False
          print('F01 exact/synthetic result reproduced and claim boundaries retained')
          PY
      - name: Reproduce symbolic identities (optional external algebra dependency)
        run: |
          python3 -m pip install 'sympy==1.14.0'
          python3 scripts/check_me007_symbolic.py
          python3 scripts/check_me007_covariant_symbolic.py
      - name: Regenerate and compare frozen F02 scalar-tensor reference
        run: |
          cp results/me007_covariant_reference.json /tmp/me007_covariant_frozen.json
          cp results/me007_covariant_symbolic.json /tmp/me007_covariant_sym_frozen.json
          python3 scripts/run_me007_covariant.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('/tmp/me007_covariant_frozen.json').read_text())
          b=json.loads(Path('results/me007_covariant_reference.json').read_text())
          c=json.loads(Path('/tmp/me007_covariant_sym_frozen.json').read_text())
          d=json.loads(Path('results/me007_covariant_symbolic.json').read_text())
          assert a==b and c==d, 'F02 frozen diagnostics changed'
          assert b['max_normalized_friedmann_residual'] < 1e-9
          assert b['physical_information_field_identified'] is False
          assert b['new_EFMW_effect_established'] is False
          assert b['full_theory_of_everything'] is False
          assert d['status']=='PASS' and d['count']==8
          print('F02 reference and symbolic checks verified; physical gates remain open')
          PY
      - name: Enforce scientific claim boundary in reference JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('results/me007_flrw_reference.json').read_text())
          q=json.loads(Path('results/me007_symbolic_checks.json').read_text())
          assert p['status']=='CONDITIONAL_CLASSICAL_FLRW_ONLY'
          assert p['historical_efmw_information_tensor_identified'] is False
          assert p['quantum_gravity_derived'] is False
          assert p['full_theory_of_everything'] is False
          assert q['status']=='PASS' and q['count']==8
          print('Bounded candidate results; historical EFMW and TOE claims remain unresolved')
          PY
      - name: Regenerate and check F03 dynamic-oscillator record (synthetic only)
        run: |
          python3 scripts/run_f03_oscillators.py --out /tmp/f03_reproduced.json
          python3 - <<'PY'
          import json,math
          from pathlib import Path
          frozen=json.loads(Path('results/f03_oscillator_reference.json').read_text())
          actual=json.loads(Path('/tmp/f03_reproduced.json').read_text())
          for key in ('observed_MI_nats','theory_MI_nats_from_independently_specified_stiffness',
                      'estimated_correlation','shift_null_max_nats'):
              assert math.isclose(frozen['analysis'][key],actual['analysis'][key],rel_tol=0,abs_tol=1e-12),(key,frozen['analysis'][key],actual['analysis'][key])
          assert frozen['analysis']['n_paired']==actual['analysis']['n_paired']==30000
          assert actual['origin']['measurement_claim']=='SYNTHETIC_ONLY'
          assert actual['historical_ME006_tensor_identified'] is False
          assert actual['new_efmw_physics_established'] is False
          assert actual['analysis']['distinguishes_EFMW_from_ordinary_oscillators'] is False
          assert actual['analysis']['q_field_identified_by_measurement'] is False
          print('F03 dynamic simulation reproduced and physical-claim gates remain closed')
          PY
      - name: Validate inline laboratory JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          import pathlib
          html=pathlib.Path('index.html').read_text()
          snippets=re.findall(r'<script>(.*?)</script>',html,re.S)
          assert len(snippets)==2
          for i,s in enumerate(snippets):
              pathlib.Path('/tmp/toe001-lab-%s.js'%i).write_text(s)
          print('Found',len(snippets),'inline scripts')
          PY
          node --check /tmp/toe001-lab-0.js
          node --check /tmp/toe001-lab-1.js
